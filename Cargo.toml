[package]
name = "vexlang"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Alpha interpreter and typed IR prototype for the Vex language"
readme = "README.md"
repository = "https://github.com/darkstardevx/vexlang"
homepage = "https://github.com/darkstardevx/vexlang"

# If you had [workspace] here, remove it for now.
# You only need workspace if you are splitting the compiler into
# multiple separate crates (e.g., vexlang-core, vexlang-cli).

[dependencies]
pest = "2.7"
pest_derive = "2.7"
