[package]
name = "vexlang"
version = "0.1.0"
edition = "2024"

# If you had [workspace] here, remove it for now.
# You only need workspace if you are splitting the compiler into
# multiple separate crates (e.g., vexlang-core, vexlang-cli).

[dependencies]
pest = "2.7"
pest_derive = "2.7"
logos = "0.15"
regex = "1.13.1"
walkdir = "2.5.0"
lazy_static = "1.5.0"
