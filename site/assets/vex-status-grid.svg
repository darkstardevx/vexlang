<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" role="img" aria-labelledby="title desc"><title id="title">VexLang Grid status cards</title><desc id="desc">Three status cards for the interpreter, typed IR, and QBE backend.</desc><rect width="900" height="220" rx="18" fill="#080d15"/><g transform="translate(18 28)"><rect width="268" height="164" rx="5" fill="#0d1720" stroke="#3f7e8c" stroke-width="2"/><text x="22" y="42" fill="#78ff38" font-family="monospace" font-size="12" letter-spacing="2">01 / RUN</text><text x="22" y="86" fill="#f3f6ff" font-family="monospace" font-size="24" font-weight="700">INTERPRETER</text><path d="M22 118h224" stroke="#214254"/><text x="22" y="145" fill="#62e7ff" font-family="monospace" font-size="11">STATUS: READY</text></g><g transform="translate(316 28)"><rect width="268" height="164" rx="5" fill="#0d1720" stroke="#3f7e8c" stroke-width="2"/><text x="22" y="42" fill="#62e7ff" font-family="monospace" font-size="12" letter-spacing="2">02 / CHECK</text><text x="22" y="86" fill="#f3f6ff" font-family="monospace" font-size="24" font-weight="700">TYPED IR</text><path d="M22 118h224" stroke="#214254"/><text x="22" y="145" fill="#62e7ff" font-family="monospace" font-size="11">STATUS: VALID</text></g><g transform="translate(614 28)"><rect width="268" height="164" rx="5" fill="#0d1720" stroke="#6a572c" stroke-width="2"/><text x="22" y="42" fill="#ffbf4a" font-family="monospace" font-size="12" letter-spacing="2">03 / LOWER</text><text x="22" y="86" fill="#f3f6ff" font-family="monospace" font-size="24" font-weight="700">QBE IL</text><path d="M22 118h224" stroke="#4d3f28"/><text x="22" y="145" fill="#ffbf4a" font-family="monospace" font-size="11">STATUS: ALPHA</text></g></svg>
